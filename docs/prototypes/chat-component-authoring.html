  function architectureHTML(){const c=component();const labels=['编辑源码','构建','预览检查','登记构建','更新展示'],subs=['工作副本','同份输入','截图 / 交互','不可变产物','当前会话'];const p=c?.pipeline||{stage:-1,status:'idle',feedback:'先在任意原会话 @Hallmark，然后提出创建或编辑组件的需求。'};let stageHTML=labels.map((label,i)=>{let status=p.stage===5?'done':i<p.stage?'done':i===p.stage?(p.status==='failed'?'failed':'active'):'';return '<div class="stage '+status+'"><span class="stage-num">'+(status==='done'?'✓':i+1)+'</span><strong>'+label+'</strong><small>'+subs[i]+'</small></div>';}).join('');
    const identity=c?[['原会话',session().id],['工作副本',c.draftId],['编辑源码',c.sourceId+' · r'+c.sourceRevision],['可用构建',c.hasGoodView===false?'尚无已验证构建':c.buildId+' · '+c.buildSourceId+' r'+c.buildSourceRevision],['会话展示',c.hasGoodView===false?'尚无可用展示':c.viewId+'（编辑保持同一 view）'],['保存资产',c.savedAssetId||'未保存'],['源码来源版本',c.savedAssetId?'v'+c.sourceAssetRevision:'未保存工作副本'],['更新比较基线',c.savedAssetId?'v'+c.baseRevision+'（CAS 比较）':'首次保存'],['最近尝试',c.lastAttempt?c.lastAttempt.id+' · '+c.lastAttempt.status:'当前已验证构建']]:[['原会话',session().id],['应用引用',session().activeApp||'未引用']];
    return '<header class="drawer-head"><div><h2 id="architecture-title">聊天 → 组件的完整闭环</h2><p>架构演示 · 与右侧组件共享同一份本地状态</p></div><button class="btn icon" data-action="close-architecture" aria-label="关闭架构流程">'+svg('close')+'</button></header><div class="drawer-body"><div class="arch-note">任意原会话 <strong>@应用</strong> → 同一个 Agent 创建或编辑工作副本 → 验证后更新组件展示 → 用户继续反馈。<br>只有明确保存，才写入组件资产的新版本。</div><h3 class="flow-heading">创建与编辑共用的执行链</h3><div class="pipeline">'+stageHTML+'</div><div class="feedback-box" style="margin-top:13px"><strong>'+escape(p.feedback)+'</strong>'+ (c?.lastAttempt?'<pre>'+escape(JSON.stringify({attemptId:c.lastAttempt.id,sourceId:c.lastAttempt.sourceId,sourceRevision:c.lastAttempt.sourceRevision,buildId:c.lastAttempt.buildId,status:c.lastAttempt.status},null,2))+'</pre>':'')+'</div><h3 class="flow-heading">工作副本 / 构建 / 展示 / 保存版本</h3><div class="identity-list">'+identity.map(([label,value])=>'<div class="identity-row"><span>'+label+'</span><code>'+escape(value)+'</code></div>').join('')+'</div><div class="arch-links"><p><strong>附件：</strong>勾选商品 → 本地筛选结果生成 JSON → 添加到原输入框的附件区 → 用户手动发送。附加动作不会清空正文，也不会发送消息。</p><p><strong>跨会话：</strong>每条原会话各有自己的应用引用、输入草稿、附件和工作副本。打开同一保存资产，会创建当前会话自己的 view；源码编辑不跨会话污染。</p><p><strong>失败与冲突：</strong>构建失败保留上一份可用展示；保存比较工作副本基于的版本与最新版本，冲突时要求显式处理，不静默覆盖。</p><p><strong>本原型：</strong>“构建 / 截图 / 登记”均是本地状态模拟，用于评审架构和体验。实际产品需要接入真实源码工具、构建与预览验证器、Runtime 和原生附件接口。</p></div><h3 class="flow-heading">试试边界场景</h3><div class="arch-demo-actions"><button class="btn" data-action="build-failure" '+(!c||c.status==='building'?'disabled':'')+'>演示构建失败</button><button class="btn" data-action="simulate-conflict" '+(!c||c.status==='building'?'disabled':'')+'>演示保存冲突</button><button class="btn" data-action="export-state">导出本地状态</button><button class="btn" data-action="reset">重置演示</button></div><p class="reset-note">会话、附件和组件库存于浏览器 localStorage（schema v3）。重置只清空本原型记录。商品数值全部是示例，不向任何外部服务发送。</p></div>';
  }
  function renderArchitecture(){
    const drawer=el('architecture');drawer.innerHTML=architectureHTML();
    const drafts=session().parkedDrafts||[];
    if(drafts.length){const section=document.createElement('section');section.innerHTML='<h3 class="flow-heading">当前原会话保留的工作副本</h3><p class="field-help">打开保存资产之前的未保存设计仍在这里，可明确恢复。</p><div class="arch-demo-actions">'+drafts.map((draft,index)=>'<button class="btn" data-action="restore-draft" data-index="'+index+'">恢复 '+escape(draft.title)+' · '+escape(draft.draftId)+'</button>').join('')+'</div>';drawer.querySelector('.reset-note').before(section);}
    const versionNote=document.createElement('p');versionNote.innerHTML='<strong>展示与版本：</strong>编辑当前草稿保留同一个 viewId，成功后只更换它引用的构建。新建组件或打开资产才分配新 view。打开历史 v1 时可以读取 v1 的源码，但更新基线取打开时资产的最新版本；此后如果最新版本再次改变，保存会报告冲突。';drawer.querySelector('.arch-links').append(versionNote);
    replaceIcons(drawer);
  }
  function openArchitecture(){ui.drawerOpen=true;renderArchitecture();el('architecture').showModal();}
  function closeArchitecture(){ui.drawerOpen=false;el('architecture').close();}
  function simulateConflict(){const c=component();if(!c||c.status!=='ready'){toast('请先让当前修改成功构建，再演示保存版本冲突。');return;}if(!c.savedAssetId){toast('请先明确保存组件，再编辑后体验版本冲突。这个按钮不会替你保存。');return;}const asset=state.assets[c.savedAssetId],latest=asset.revisions.at(-1);asset.revisions.push({...clone(latest),revision:latest.revision+1,savedAt:now()});asset.updatedAt=now();c.dirty=true;persist();if(ui.drawerOpen)closeArchitecture();render();modalOpen('save');showModalError('模拟另一个编辑者已经保存 v'+asset.revisions.at(-1).revision+'。当前工作副本仍基于 v'+c.baseRevision+'；点击确认保存会被冲突检查拒绝。');}
  function downloadJSON(name,value){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);}
  function reset(){taskSerial+=1;buildTokens.clear();state=initialState();ui.mode='chat';ui.appTab='library';ui.directoryApp='hallmark';mentionDismissed=true;storageWarning='';storageWriteBlocked=false;persist();render({preserve:false,scroll:true});toast('已重置本地交互原型。');}
  function switchSession(id){if(!state.sessions[id])return;state.activeSession=id;ui.mode='chat';mentionDismissed=true;persist();render({preserve:false,scroll:true});el('composer-input')?.focus();}
  async function action(name,node){const c=component();switch(name){
    case 'session':switchSession(node.dataset.id);break;
    case 'new-session':{const id=nextId('session');state.sessions[id]={id,title:'新会话 '+(Object.keys(state.sessions).length+1),draft:'',attachments:[],activeApp:null,component:null,messages:[{role:'agent',text:'在这条原会话中输入 @ 可以选择应用，然后让 Agent 创建或编辑组件。',at:now()}]};switchSession(id);break;}
    case 'plugins':toast('这里保留原 DSH 导航；本原型只演示应用与组件体验。');break;
    case 'apps':ui.mode='apps';ui.directoryApp='hallmark';render({preserve:false});break;
    case 'back-chat':ui.mode='chat';render({preserve:false});el('composer-input')?.focus();break;
    case 'architecture':openArchitecture();break;case 'close-architecture':closeArchitecture();break;
    case 'app-tab':ui.appTab=node.dataset.tab;render({preserve:false});break;
    case 'directory-app':ui.directoryApp=node.dataset.id;render({preserve:false});break;
    case 'mention':{const input=el('composer-input');if(!input)return;const prefix=input.value&& !/\s$/.test(input.value)?' ':'';session().draft=input.value+prefix+'@';mentionDismissed=false;mentionIndex=0;persist();render();el('composer-input')?.focus();el('composer-input')?.setSelectionRange(session().draft.length,session().draft.length);renderMention();break;}
    case 'select-app':selectApp(node.dataset.id);break;
    case 'remove-app':session().activeApp=null;persist();render();el('composer-input')?.focus();break;
    case 'send':await sendCommand();break;
    case 'command':if(!session().activeApp)session().activeApp='hallmark';await sendCommand(node.dataset.command);break;
    case 'remove-attachment':session().attachments=session().attachments.filter(a=>a.id!==node.dataset.id);persist();render();el('composer-input')?.focus();break;
    case 'attach-selected':attachSelected();break;
    case 'open-pane':if(c){c.paneOpen=true;ui.mode='chat';persist();render({preserve:false});}else toast('这条会话当前没有组件；可以从组件库打开。');break;
    case 'close-pane':if(c)c.paneOpen=false;ui.mode='chat';persist();render({preserve:false});el('composer-input')?.focus();break;
    case 'expand':if(c){c.paneOpen=true;ui.mode='apps';ui.appTab='workspace';ui.directoryApp='hallmark';render({preserve:false});}break;
    case 'refresh':refreshData();break;
    case 'save':if(c)modalOpen('save');break;case 'save-as':if(c)modalOpen('save-as');break;
    case 'close-modal':closeModal();break;
    case 'rename-asset':modalOpen('rename',node.dataset.id);break;
    case 'delete-asset':modalOpen('delete',node.dataset.id);break;
    case 'open-asset':openAsset(node.dataset.id);break;
    case 'conflict-save-as':{const name=el('asset-name').value;modalContext.kind='save-as';const result=saveAsset(name,{saveAs:true});if(result.ok){closeModal();render();toast('已另存新组件 · v1，原资产未覆盖。');}break;}
    case 'conflict-latest':{const id=c.savedAssetId;closeModal();openAsset(id,state.assets[id].revisions.at(-1).revision);toast('原修改已保留到会话草稿，已打开最新保存版本。');break;}
    case 'restore-draft':restoreParkedDraft(Number(node.dataset.index));break;
    case 'build-failure':if(c){await runBuild(session(),{fail:true,config:clone(c.config)});}break;
    case 'simulate-conflict':simulateConflict();break;
    case 'export-state':downloadJSON('dsh-component-prototype-state.json',state);toast('已导出当前本地状态。');break;
    case 'reset':{if(ui.drawerOpen)closeArchitecture();modalContext={kind:'reset'};el('modal').innerHTML='<form id="reset-form"><div class="modal-body"><h2 id="modal-title">重置交互原型？</h2><p class="modal-description">仅清除这个原型的本地会话、附件和组件资产。真实 DSH 与店铺完全不受影响。</p></div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">取消</button><button class="btn danger" type="submit">确认重置</button></div></form>';el('modal').showModal();break;}
  }}
  document.addEventListener('click',event=>{const node=event.target.closest('[data-action]');if(node&&!node.disabled)action(node.dataset.action,node).catch(error=>{console.error(error);toast('本地模拟出现错误：'+error.message);});});
  document.addEventListener('input',event=>{const node=event.target;if(node.id==='composer-input'){session().draft=node.value;mentionDismissed=false;mentionIndex=0;persist();renderMention();updateSendButton();return;}const c=component();if(!c)return;if(node.dataset.control==='search'){c.search=node.value;persist();render();}if(node.dataset.control==='threshold'){if(node.value==='')return;c.threshold=Math.min(99,Math.max(0,Number(node.value)||0));persist();render();}});
  document.addEventListener('change',event=>{const node=event.target,c=component();if(!c)return;switch(node.dataset.control){case 'low-only':c.lowOnly=node.checked;break;case 'sort':c.sort=node.value;break;case 'select-product':c.selected=node.checked?[...new Set([...c.selected,node.dataset.id])]:c.selected.filter(id=>id!==node.dataset.id);break;case 'select-all':{const ids=visibleRows(c).map(p=>p.id);c.selected=node.checked?[...new Set([...c.selected,...ids])]:c.selected.filter(id=>!ids.includes(id));break;}default:return;}persist();render();});
  document.addEventListener('keydown',event=>{if(event.target.id!=='composer-input')return;const mention=currentMention(),candidates=mentionCandidates();if(mention){if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();mentionIndex=(mentionIndex+(event.key==='ArrowDown'?1:-1)+candidates.length)%Math.max(1,candidates.length);renderMention();return;}if(event.key==='Escape'){event.preventDefault();mentionDismissed=true;renderMention();return;}if(event.key==='Enter'&&!event.shiftKey&&candidates.length){event.preventDefault();selectApp(candidates[mentionIndex].id);return;}}if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendCommand();}});
  document.addEventListener('selectionchange',()=>{if(document.activeElement?.id==='composer-input')renderMention();});
  document.addEventListener('submit',event=>{if(event.target.id==='modal-form')submitModal(event);if(event.target.id==='reset-form'){event.preventDefault();closeModal();reset();}});
  el('architecture').addEventListener('cancel',()=>{ui.drawerOpen=false;});el('modal').addEventListener('cancel',()=>{modalContext=null;});
  window.demo=Object.freeze({snapshot:()=>clone(state),reset,command:async text=>sendCommand(String(text)),switchSession,openAsset,refresh:refreshData,simulateBuildFailure:async()=>{if(component())await runBuild(session(),{fail:true,config:clone(component().config)});},simulateConflict,save:(name,saveAs=false)=>{const result=saveAsset(String(name),{saveAs});render();return result;},openArchitecture,openApps:()=>{ui.mode='apps';ui.appTab='library';render({preserve:false});},attachSelected,selectApp,version:SCHEMA});
  showStorageWarning();render({preserve:false,scroll:true});
