<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1230" viewBox="0 0 1720 1230" role="img" aria-label="FIG-13  原聊天中创建、编辑与保存组件">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5278ae"/></marker><marker id="loop" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#bd7e18"/></marker></defs>
<rect width="1720" height="1230" fill="#f6f9fe"/>
<text x="64" y="64" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="32" font-weight="700" fill="#14243d" text-anchor="start">FIG-13  原聊天中创建、编辑与保存组件</text>
<text x="64" y="104" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">A.1 目标流程 · 任意原会话 @应用 · 保留 DSH 原聊天与导航，仅改插件区域</text>
<text x="72" y="184" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#1769e8" text-anchor="start">引用与原发送</text>
<text x="600" y="184" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#1769e8" text-anchor="start">绑定与唯一写入者</text>
<text x="1128" y="184" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#1769e8" text-anchor="start">已有 Agent 与已有工具</text>
<rect x="72" y="210" width="480" height="150" rx="16" fill="#ffffff" stroke="#ccd9ed" stroke-width="1.6"/>
<text x="96" y="253" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#14243d" text-anchor="start">1  原输入框 @应用</text>
<text x="96" y="295" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">任意已有会话；保留正文与附件</text>
<text x="96" y="328" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">引用不自动发送；用户原方式发送</text>
<rect x="600" y="210" width="480" height="150" rx="16" fill="#ffffff" stroke="#ccd9ed" stroke-width="1.6"/>
<text x="624" y="253" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#14243d" text-anchor="start">2  真实会话 / 连接绑定</text>
<text x="624" y="295" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">Host 核实 sessionId + appId</text>
<text x="624" y="328" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">Runtime 激活明确 connectionId</text>
<rect x="1128" y="210" width="480" height="150" rx="16" fill="#ffffff" stroke="#ccd9ed" stroke-width="1.6"/>
<text x="1152" y="253" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#14243d" text-anchor="start">3  同一个原 DSH Agent</text>
<text x="1152" y="295" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">消费原发送；发现已有能力工具</text>
<text x="1152" y="328" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">使用原文件 / 命令工具</text>
<rect x="1128" y="425" width="480" height="150" rx="16" fill="#ffffff" stroke="#ccd9ed" stroke-width="1.6"/>
<text x="1152" y="468" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#14243d" text-anchor="start">4  独立可编辑工作副本</text>
<text x="1152" y="510" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">新建 / 复制模板，或 saved checkout</text>
<text x="1152" y="543" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">旧构建、旧保存版本保持可读</text>
<rect x="600" y="425" width="480" height="150" rx="16" fill="#ffffff" stroke="#ccd9ed" stroke-width="1.6"/>
<text x="624" y="468" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#14243d" text-anchor="start">5  编辑源码与只读绑定</text>
<text x="624" y="510" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">普通 React / TSX / CSS / 资源 / 依赖</text>
<text x="624" y="543" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">appId + connectionId + bindingId</text>
<rect x="72" y="425" width="480" height="150" rx="16" fill="#ffffff" stroke="#ccd9ed" stroke-width="1.6"/>
<text x="96" y="468" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#14243d" text-anchor="start">6  构建同一份 dist</text>
<text x="96" y="510" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">源文件 + 锁文件 + dist 内容快照</text>
<text x="96" y="543" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">构建失败保留旧可用视图</text>
<rect x="72" y="650" width="480" height="150" rx="16" fill="#fffaf0" stroke="#ebd098" stroke-width="1.6"/>
<text x="96" y="693" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#14243d" text-anchor="start">7  真实预览与验证反馈</text>
<text x="96" y="735" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">同份 dist：截图 / 运行错误 / 交互</text>
<text x="96" y="768" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">报告匹配 buildId；失败继续修改</text>
<rect x="600" y="650" width="480" height="150" rx="16" fill="#eef6ff" stroke="#a7c8f3" stroke-width="1.6"/>
<text x="624" y="693" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#14243d" text-anchor="start">8  登记不可变构建</text>
<text x="624" y="735" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">capture / open_source_component</text>
<text x="624" y="768" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">Runtime 事务更新草稿和引用</text>
<rect x="1128" y="650" width="480" height="150" rx="16" fill="#eef8f4" stroke="#a6d5bf" stroke-width="1.6"/>
<text x="1152" y="693" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#14243d" text-anchor="start">9  本会话 viewId 展示</text>
<text x="1152" y="735" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">新 frameInstanceId 握手与加载检查</text>
<text x="1152" y="768" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">只改应用 / 右侧组件；尚未正式保存</text>
<rect x="72" y="900" width="600" height="200" rx="16" fill="#eef6ff" stroke="#a7c8f3" stroke-width="1.6"/>
<text x="96" y="943" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#14243d" text-anchor="start">10  原聊天继续提出修改</text>
<text x="96" y="985" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">保持 sessionId / viewId 与工作目录</text>
<text x="96" y="1018" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">反馈回到同一 Agent，重复构建验证</text>
<text x="96" y="1051" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">无需独立聊天标签</text>
<rect x="742" y="900" width="420" height="200" rx="16" fill="#ffffff" stroke="#ccd9ed" stroke-width="1.6"/>
<text x="766" y="943" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#14243d" text-anchor="start">11  用户明确保存</text>
<text x="766" y="985" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">save_as：新 componentId</text>
<text x="766" y="1018" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">update：componentId</text>
<text x="766" y="1051" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">+ expectedRevision</text>
<text x="766" y="1084" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">冲突保留工作副本</text>
<rect x="1220" y="900" width="420" height="200" rx="16" fill="#eef8f4" stroke="#a6d5bf" stroke-width="1.6"/>
<text x="1244" y="943" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#14243d" text-anchor="start">12  组件库版本资产</text>
<text x="1244" y="985" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">保存 revision；历史版本保留</text>
<text x="1244" y="1018" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">另一会话打开 → 新 view / checkout</text>
<text x="1244" y="1051" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="21" font-weight="400" fill="#5f718c" text-anchor="start">刷新只更新数据，不改设计</text>
<path d="M552 285 H600" fill="none" stroke="#5278ae" stroke-width="2.7"  marker-end="url(#arrow)"/>
<path d="M1080 285 H1128" fill="none" stroke="#5278ae" stroke-width="2.7"  marker-end="url(#arrow)"/>
<path d="M1368 360 V425" fill="none" stroke="#5278ae" stroke-width="2.7"  marker-end="url(#arrow)"/>
<path d="M1128 500 H1080" fill="none" stroke="#5278ae" stroke-width="2.7"  marker-end="url(#arrow)"/>
<path d="M600 500 H552" fill="none" stroke="#5278ae" stroke-width="2.7"  marker-end="url(#arrow)"/>
<path d="M312 575 V650" fill="none" stroke="#5278ae" stroke-width="2.7"  marker-end="url(#arrow)"/>
<path d="M552 725 H600" fill="none" stroke="#5278ae" stroke-width="2.7"  marker-end="url(#arrow)"/>
<text x="560" y="704" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="17" font-weight="400" fill="#1769e8" text-anchor="start">通过</text>
<path d="M1080 725 H1128" fill="none" stroke="#5278ae" stroke-width="2.7"  marker-end="url(#arrow)"/>
<path d="M312 650 V612 H840 V575" fill="none" stroke="#bd7e18" stroke-width="2.7" stroke-dasharray='8 6' marker-end="url(#loop)"/>
<text x="438" y="607" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="18" font-weight="400" fill="#996917" text-anchor="start">不合格：反馈后继续修改</text>
<path d="M1368 800 V850 H372 V900" fill="none" stroke="#5278ae" stroke-width="2.7"  marker-end="url(#arrow)"/>
<path d="M1368 850 H952 V900" fill="none" stroke="#5278ae" stroke-width="2.7"  marker-end="url(#arrow)"/>
<path d="M1162 990 H1220" fill="none" stroke="#5278ae" stroke-width="2.7"  marker-end="url(#arrow)"/>
<path d="M72 995 H28 V145 H1368 V210" fill="none" stroke="#5278ae" stroke-width="2.7" stroke-dasharray='8 6' marker-end="url(#arrow)"/>
<text x="824" y="144" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="19" font-weight="400" fill="#1769e8" text-anchor="start">下一轮原聊天 → 同一 Agent</text>
<path d="M1640 990 H1688 V500 H1608" fill="none" stroke="#5278ae" stroke-width="2.7" stroke-dasharray='8 6' marker-end="url(#arrow)"/>
<text x="1450" y="866" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="18" font-weight="400" fill="#1769e8" text-anchor="start">保存版打开 → 新副本</text>
<rect x="72" y="1117" width="1568" height="76" rx="12" fill="#eaf0f9"/>
<text x="92" y="1145" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="20" font-weight="400" fill="#14243d" text-anchor="start">边界：本地筛选 / 排序 / 勾选不调用模型；“附加到聊天”产生原生附件，等待用户手动发送。</text>
<text x="92" y="1176" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="19" font-weight="400" fill="#5f718c" text-anchor="start">此图是架构目标，不是部署证明。@ 接线与 v2 真实预览反馈需验证；requestAgent 是另一条可选路径。</text>
</svg>